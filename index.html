<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NOIR DEPT.</title>
    <meta
      name="description"
      content="Secondhand branded streetwear with real photos and honest condition. New drops posted on Facebook."
    />
    <meta name="theme-color" content="#0D0D0D" />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="https://noirdept.ai.studio/" />

    <!-- Open Graph defaults (static for Facebook & social scrapers without JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NOIR DEPT." />
    <meta property="og:title" content="NOIR DEPT." />
    <meta
      property="og:description"
      content="Secondhand branded streetwear with real photos and honest condition. New drops posted on Facebook."
    />
    <meta property="og:url" content="https://noirdept.ai.studio/" />
    <meta property="og:image" content="https://noirdept.ai.studio/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NOIR DEPT." />
    <meta property="og:locale" content="en_PH" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NOIR DEPT." />
    <meta
      name="twitter:description"
      content="Secondhand branded streetwear with real photos and honest condition. New drops posted on Facebook."
    />
    <meta name="twitter:image" content="https://noirdept.ai.studio/og-image.jpg" />

    <!-- Icons & Web Manifest -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Domain verification placeholders (uncomment and fill in when ready) -->
    <!-- <meta name="google-site-verification" content="" /> -->
    <!-- <meta name="facebook-domain-verification" content="" /> -->

    <!-- Fonts: preconnect, preload hero serif stylesheet, display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500..800;1,400..700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500..800;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          localStorage.removeItem('noir-dept-theme');
          var saved = localStorage.getItem('noir-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#0D0D0D' : '#E5E5E1');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-noir text-ivory antialiased selection:bg-ivory selection:text-noir">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
