<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOIR DEPT. — Streetwear • Rare Finds</title>
    <meta
      name="description"
      content="Independent resale shop for secondhand branded streetwear, graphic hoodies, and distinctive pre-loved pieces."
    />
    <meta property="og:title" content="NOIR DEPT. — Streetwear • Rare Finds" />
    <meta
      property="og:description"
      content="Independent resale shop for secondhand branded streetwear, graphic hoodies, and distinctive pre-loved pieces."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0D0D0D" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500..800;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('noir-dept-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-noir text-ivory antialiased selection:bg-ivory selection:text-noir">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
